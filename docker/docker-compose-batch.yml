version: '3.8'

# Prod defaults. For stage locally, also pass the stage override file:
#   docker compose -f docker/docker-compose-batch.yml -f docker/docker-compose-batch.stage.yml up --build

services:
  batch-transcription:
    build: .
    container_name: multimodal-transcription-batch
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PYTHONUNBUFFERED=1
      - S3_BUCKET_PATH=bci-prod-upload
      # Optional prod API overrides (defaults in code match prod if unset):
      # - VIDEO_FETCHER_URL=https://886hed58x9.execute-api.us-east-1.amazonaws.com/prod/api/v1/files/paths/toTranscribe
      # - NOTIFICATION_API_URL=https://886hed58x9.execute-api.us-east-1.amazonaws.com/prod/pipeline/aiTranscription-Complete
      # - S3_DEST_BUCKET=bci-multimodal-transcripts-prod
    volumes:
      # Mount data directory for videos and database
      - ./data:/app/data
      # Mount outputs directory for results
      - ./outputs:/app/outputs
      # Mount logs directory
      - ./logs:/app/logs
    working_dir: /app
    command: >
      python src/batch_transcription_processor.py
      --output-dir /app/outputs
      --data-dir /app/data
    restart: "no"  # Don't restart automatically - let ECS handle it
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

volumes:
  outputs:
    driver: local
  data:
    driver: local
  logs:
    driver: local
